# Gitleaks configuration: default rules plus narrowly scoped allowlists.
title = "raadi"

[extend]
useDefault = true

[[allowlists]]
description = "Build output and dependencies (never committed)"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.build/''',
  '''(^|/)dist/''',
  '''(^|/)\.turbo/''',
  '''(^|/)playwright-report/''',
]

[[allowlists]]
description = "Known false positives of generic-api-key"
regexTarget = "line"
regexes = [
  # image references such as valkey/valkey:9.0.6-alpine3.24
  '''valkey/valkey:[\w.-]+''',
  # C4 diagram element named "sec"
  '''Container\(sec, "ai-cybersecurity"''',
]
