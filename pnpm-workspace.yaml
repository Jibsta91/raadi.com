packages:
  - apps/*
  - services/*
  - packages/*
  - tests/*
# expo-router strips the web base URL (/m) without a path boundary, so /my-listings became /y-listings in
# exported builds. The patch adds the boundary; drop it once upstream fixes stripBaseUrl.
patchedDependencies:
  expo-router@57.0.24: patches/expo-router@57.0.24.patch
