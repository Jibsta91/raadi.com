# clamd for upload scanning over TCP (INSTREAM). Only the media service can
# reach this port (the "scan" network in deploy/compose/storage.yaml).
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
ExtendedDetectionInfo yes
# Uploads are capped at 10 MB by the media service; allow a little headroom.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 48M
MaxThreads 4
# Reload signatures in place: avoids holding two databases in memory (ADR-0011).
ConcurrentDatabaseReload no
SelfCheck 3600
