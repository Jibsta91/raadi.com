# Raadi PostgreSQL configuration (laptop-sized defaults; production overrides
# via compose.prod.yaml command flags).
listen_addresses = '*'
max_connections = 200
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
# Logical decoding for Debezium CDC (outbox + lakehouse pipelines).
wal_level = logical
max_replication_slots = 16
max_wal_senders = 16
# A stalled CDC slot may retain at most this much WAL before it is invalidated.
max_slot_wal_keep_size = 2GB
# Observability
log_min_duration_statement = 500ms
log_connections = off
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a '
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
# Security
password_encryption = scram-sha-256
timezone = 'UTC'
