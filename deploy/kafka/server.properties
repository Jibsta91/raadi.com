# Single-node KRaft (combined broker + controller). Laptop-sized; production
# overrides partitions/replication through compose.prod.yaml.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER

# Clients authenticate with SASL/SCRAM on the internal network. The controller
# listener is bound to loopback, so nothing outside the container reaches it.
listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=INTERNAL://kafka:9092
listener.security.protocol.map=INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

# Deny by default; every principal gets explicit ACLs from kafka-init.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
# ANONYMOUS only exists on the loopback controller listener (broker -> controller).
super.users=User:admin;User:ANONYMOUS

log.dirs=/var/lib/kafka/data
auto.create.topics.enable=false
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0
log.retention.hours=168
log.segment.bytes=104857600
