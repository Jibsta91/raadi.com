# Public routes. Hostnames derive from RAADI_DOMAIN so the same file serves
# raadi.localhost in development and the real domain in production.
{{ $d := env "RAADI_DOMAIN" }}
http:
  routers:
    web:
      rule: Host(`{{ $d }}`)
      entryPoints: [web, websecure]
      service: web
      middlewares: [security-headers, web-csp, ratelimit-default, compress]
      priority: 1

    auth-flows:
      rule: Host(`{{ $d }}`) && PathPrefix(`/auth/`) && !Path(`/auth/forward`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-auth]
      priority: 100

    api-identity:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/identity/`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-default, forward-auth]
      priority: 100

    keycloak:
      rule: >-
        Host(`auth.{{ $d }}`) && (PathPrefix(`/realms/`) || PathPrefix(`/resources/`) || PathPrefix(`/js/`)
        {{- if ne (env "KEYCLOAK_ADMIN_PUBLIC") "false" }} || PathPrefix(`/admin/`){{ end }})
      entryPoints: [web, websecure]
      service: keycloak
      middlewares: [security-headers, ratelimit-auth]

    grafana:
      rule: Host(`grafana.{{ $d }}`)
      entryPoints: [web, websecure]
      service: grafana
      middlewares: [security-headers, ratelimit-default]

  services:
    web:
      loadBalancer:
        servers: [{ url: "http://web:3000" }]
        healthCheck: { path: /api/health, interval: 10s, timeout: 3s }
    identity-bff:
      loadBalancer:
        servers: [{ url: "http://identity-bff:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    keycloak:
      loadBalancer:
        servers: [{ url: "http://keycloak:8080" }]
    grafana:
      loadBalancer:
        servers: [{ url: "http://grafana:3000" }]
