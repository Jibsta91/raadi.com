# Public routes. Hostnames derive from RAADI_DOMAIN so the same file serves
# raadi.localhost in development and the real domain in production.
{{ $d := env "RAADI_DOMAIN" }}
http:
  routers:
    web:
      rule: Host(`{{ $d }}`)
      entryPoints: [web, websecure]
      service: web
      middlewares: [security-headers, web-csp, ratelimit-default, compress]
      priority: 1

    auth-flows:
      rule: Host(`{{ $d }}`) && PathPrefix(`/auth/`) && !Path(`/auth/forward`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-auth]
      priority: 100

    api-identity:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/identity/`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-default, forward-auth]
      priority: 100

    api-listings:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/listings`)
      entryPoints: [web, websecure]
      service: listings
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    api-search:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/search`)
      entryPoints: [web, websecure]
      service: search
      middlewares: [security-headers, ratelimit-default, compress]
      priority: 100

    api-media:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/media`)
      entryPoints: [web, websecure]
      service: media
      middlewares: [security-headers, ratelimit-default, media-body-limit, forward-auth]
      priority: 100

    # Listing images: signed imgproxy URLs only (anything else is refused upstream).
    images:
      rule: Host(`{{ $d }}`) && PathPrefix(`/img/`)
      entryPoints: [web, websecure]
      service: imgproxy
      middlewares: [security-headers, ratelimit-images, strip-img]
      priority: 100

    keycloak:
      rule: >-
        Host(`auth.{{ $d }}`) && (PathPrefix(`/realms/`) || PathPrefix(`/resources/`) || PathPrefix(`/js/`)
        {{- if ne (env "KEYCLOAK_ADMIN_PUBLIC") "false" }} || PathPrefix(`/admin/`){{ end }})
      entryPoints: [web, websecure]
      service: keycloak
      middlewares: [security-headers, ratelimit-auth]

    grafana:
      rule: Host(`grafana.{{ $d }}`)
      entryPoints: [web, websecure]
      service: grafana
      middlewares: [security-headers, ratelimit-default]

  services:
    web:
      loadBalancer:
        servers: [{ url: "http://web:3000" }]
        healthCheck: { path: /api/health, interval: 10s, timeout: 3s }
    identity-bff:
      loadBalancer:
        servers: [{ url: "http://identity-bff:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    listings:
      loadBalancer:
        servers: [{ url: "http://listings:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    search:
      loadBalancer:
        servers: [{ url: "http://search:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    media:
      loadBalancer:
        servers: [{ url: "http://media:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    imgproxy:
      loadBalancer:
        servers: [{ url: "http://imgproxy:8080" }]
    keycloak:
      loadBalancer:
        servers: [{ url: "http://keycloak:8080" }]
    grafana:
      loadBalancer:
        servers: [{ url: "http://grafana:3000" }]
