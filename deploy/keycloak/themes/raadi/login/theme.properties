# Raadi login theme: Keycloak's current theme (keycloak.v2, PatternFly 5) with
# Raadi colours and wording. Templates come from the parent, so upstream
# security fixes keep applying; only terms.ftl is overridden (link to the app).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/raadi.css
locales=en,no,so
darkMode=true
