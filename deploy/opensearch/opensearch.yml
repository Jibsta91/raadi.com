# Single-node OpenSearch for the listings index. Security plugin on: TLS between
# nodes (required by the plugin), HTTP basic auth for clients on the internal
# network (TLS terminates at the gateway, like every other internal hop).
cluster.name: raadi
node.name: opensearch
network.host: 0.0.0.0
discovery.type: single-node
# No mmap: avoids the vm.max_map_count host requirement on laptops.
node.store.allow_mmap: false
action.auto_create_index: false
indices.query.bool.max_clause_count: 4096

plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.http.enabled: false
plugins.security.authcz.admin_dn: ['CN=opensearch-admin,O=Raadi Development']
plugins.security.nodes_dn: ['CN=opensearch,O=Raadi Development']
# The security index is created from config/opensearch-security on first start.
plugins.security.allow_default_init_securityindex: true
plugins.security.restapi.roles_enabled: [all_access]
plugins.security.audit.type: log4j
plugins.security.audit.config.log4j.logger_name: audit
plugins.security.audit.config.log4j.level: INFO
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.enable_snapshot_restore_privilege: true
