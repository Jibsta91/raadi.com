# Tempo monolithic mode with local storage. The metrics generator derives RED
# metrics and the service graph from spans and remote-writes them to Prometheus.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_format: json
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 168h
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
# Only the processors Grafana uses (service map, RED metrics). "local-blocks"
# (TraceQL metrics) keeps recent traces in memory and does not fit the budget.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
usage_report:
  reporting_enabled: false
