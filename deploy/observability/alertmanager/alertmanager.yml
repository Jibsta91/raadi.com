# Routes alerts to e-mail. In development, mail goes to Mailpit
# (http://mail.raadi.localhost); production points smarthost at a real relay.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@raadi.localhost
  smtp_require_tls: false
route:
  receiver: platform-team
  group_by: [alertname, service, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: platform-team
    email_configs:
      - to: platform-team@raadi.localhost
        send_resolved: true
