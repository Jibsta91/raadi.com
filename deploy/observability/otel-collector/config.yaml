# OpenTelemetry Collector: single pipeline hub for traces, metrics and logs.
#   apps/Traefik/Keycloak --OTLP--> collector --> Tempo (traces)
#                                              --> Prometheus OTLP receiver (metrics)
#                                              --> Loki OTLP endpoint (logs)
# The collector also pulls metrics from PostgreSQL, Valkey and Kafka.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: postgres_monitor
    password: ${file:/run/secrets/raadi/postgres_monitor_password}
    collection_interval: 30s
    tls:
      insecure: true
  redis/valkey:
    endpoint: valkey:6379
    password: ${file:/run/secrets/raadi/valkey_password}
    collection_interval: 30s
  # Consumer lag and topic offsets. The "monitor" SCRAM user may describe
  # topics and groups but read nothing (deploy/kafka/init.sh).
  kafkametrics:
    brokers: [kafka:9092]
    client_id: otel-collector
    auth:
      sasl:
        username: monitor
        password: ${file:/run/secrets/raadi/kafka_monitor_password}
        mechanism: SCRAM-SHA-512
    scrapers: [brokers, topics, consumers]
    topic_match: ^raadi\.(user|listing|media|conversation)\.events$|^raadi\.dlq$
    group_match: ^(search-|media-|notifications$)
    collection_interval: 30s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 5s
  resource/env:
    attributes:
      - key: deployment.environment.name
        value: ${env:RAADI_ENV}
        action: upsert
      - key: service.namespace
        value: raadi
        action: insert
  # Defence in depth: never ship credentials to the observability stack even if
  # an instrumentation captures them (services also redact at the source).
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, attributes/scrub, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, postgresql, redis/valkey, kafkametrics]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, attributes/scrub, batch]
      exporters: [otlp_http/loki]
