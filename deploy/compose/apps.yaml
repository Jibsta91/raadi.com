# Raadi application services. Secrets come from OpenBao via per-service AppRole
# credentials mounted read-only; nothing secret is in the environment.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-node-service: &node-service
  restart: unless-stopped
  logging: *logging
  read_only: true
  # Explicit mode: Docker remounts a tmpfs as root-owned 0755 when a container
  # restarts, and these images run as non-root users.
  tmpfs: [/tmp:mode=1777]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  stop_grace_period: 20s

x-otel-env: &otel-env
  RAADI_ENV: ${RAADI_ENV}
  RAADI_VERSION: ${RAADI_VERSION}
  LOG_LEVEL: ${LOG_LEVEL}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG}
  TZ: ${TZ}

services:
  identity-bff:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/identity-bff:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: identity-bff }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: identity-bff
      PORT: '4000'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/identity-bff }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      keycloak-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  listings:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/listings:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: listings }
    environment: &listings-env
      <<: *otel-env
      OTEL_SERVICE_NAME: listings
      PORT: '4000'
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA}
    volumes: &listings-secrets
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/listings }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      authz-init: { condition: service_completed_successfully }
      opa: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck: &node-health
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  # Demo listings (SEED_DEMO_DATA=true only); idempotent, runs on every `up`.
  listings-seed:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/listings:${RAADI_VERSION}
    pull_policy: build
    restart: 'no'
    entrypoint: ['/nodejs/bin/node', '--import', './dist/telemetry.js', 'dist/seed.js']
    environment:
      <<: *listings-env
      OTEL_SERVICE_NAME: listings-seed
    volumes: *listings-secrets
    depends_on:
      listings: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  media:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/media:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: media }
    environment: &media-env
      <<: *otel-env
      OTEL_SERVICE_NAME: media
      PORT: '4000'
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA}
    volumes: &media-secrets
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/media }
    # "scan" is the only network that reaches ClamAV.
    networks: [default, scan]
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      authz-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }
      imgproxy: { condition: service_healthy }
      clamav: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck: *node-health
    deploy:
      resources:
        limits: { memory: 320M, cpus: '1.0' }

  # Demo images (SEED_DEMO_DATA=true only); idempotent, runs on every `up`.
  media-seed:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/media:${RAADI_VERSION}
    pull_policy: build
    restart: 'no'
    entrypoint: ['/nodejs/bin/node', '--import', './dist/telemetry.js', 'dist/seed.js']
    environment:
      <<: *media-env
      OTEL_SERVICE_NAME: media-seed
    volumes: *media-secrets
    depends_on:
      media: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 320M, cpus: '1.0' }

  search:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/search:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: search }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: search
      PORT: '4000'
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/search }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck: *node-health
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  messaging:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/messaging:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: messaging }
    environment: &messaging-env
      <<: *otel-env
      OTEL_SERVICE_NAME: messaging
      PORT: '4000'
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA}
    volumes: &messaging-secrets
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/messaging }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      listings: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck: *node-health
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  # Demo conversations (SEED_DEMO_DATA=true only); idempotent, runs on every `up`.
  messaging-seed:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/messaging:${RAADI_VERSION}
    pull_policy: build
    restart: 'no'
    entrypoint: ['/nodejs/bin/node', '--import', './dist/telemetry.js', 'dist/seed.js']
    environment:
      <<: *messaging-env
      OTEL_SERVICE_NAME: messaging-seed
    volumes: *messaging-secrets
    depends_on:
      messaging: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  notifications:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/notifications:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: notifications }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notifications
      PORT: '4000'
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: Raadi <no-reply@${RAADI_DOMAIN}>
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/notifications }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      keycloak-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
    healthcheck: *node-health
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  web:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/web:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      target: runtime
    tmpfs: [/tmp:mode=1777, /app/apps/web/.next/cache:mode=1777]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: web
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      IDENTITY_BFF_URL: http://identity-bff:4000
      LISTINGS_URL: http://listings:4000
      SEARCH_URL: http://search:4000
      MESSAGING_URL: http://messaging:4000
      NOTIFICATIONS_URL: http://notifications:4000
    depends_on:
      identity-bff: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 384M, cpus: '1.0' }

networks:
  scan:
    internal: true

volumes:
  secrets: {}
