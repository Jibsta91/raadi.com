# Raadi application services. Secrets come from OpenBao via per-service AppRole
# credentials mounted read-only; nothing secret is in the environment.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-node-service: &node-service
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  stop_grace_period: 20s

x-otel-env: &otel-env
  RAADI_ENV: ${RAADI_ENV}
  RAADI_VERSION: ${RAADI_VERSION}
  LOG_LEVEL: ${LOG_LEVEL}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG}
  TZ: ${TZ}

services:
  identity-bff:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/identity-bff:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/node-service/Dockerfile
      target: runtime
      args: { SERVICE: identity-bff }
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: identity-bff
      PORT: '4000'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/openbao
        read_only: true
        volume: { subpath: approle/identity-bff }
    depends_on:
      openbao-bootstrap: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
      keycloak-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '1.0' }

  web:
    <<: *node-service
    image: ${RAADI_IMAGE_PREFIX}/web:${RAADI_VERSION}
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      target: runtime
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: web
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      IDENTITY_BFF_URL: http://identity-bff:4000
    depends_on:
      identity-bff: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 384M, cpus: '1.0' }

volumes:
  secrets: {}
