# Categories for GitHub's generated release notes (by pull request label).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Security
      labels: [security]
    - title: Fixes
      labels: [bug]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation and tooling
      labels: [documentation, chore]
    - title: Other changes
      labels: ['*']
