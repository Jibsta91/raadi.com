# Phase 1 CI: the same ./raadi commands developers run locally, all in containers.
# Phase 5 extends this with multi-arch builds, SBOMs, signing, CodeQL/Semgrep,
# ZAP and path-based job selection.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, scans
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build toolbox
        run: docker compose --profile tools build toolbox
      - run: ./raadi lint
      - run: ./raadi typecheck
      - run: ./raadi test
      - run: ./raadi test-integration
      - run: ./raadi licenses
      - run: ./raadi security
      - run: ./raadi iac-scan

  stack:
    name: Full stack (compose up, smoke, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose up --wait
        run: docker compose up -d --wait --wait-timeout 900
      - name: Smoke test
        run: ./raadi smoke
      - name: Playwright end-to-end tests
        run: ./raadi e2e
      - name: Collect logs
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stack-diagnostics
          path: |
            compose-ps.txt
            compose-logs.txt
            tests/e2e/playwright-report/
          retention-days: 7
