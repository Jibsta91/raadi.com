# Phase 1 CI: the same ./raadi commands developers run locally, all in containers.
# Phase 5 extends this with multi-arch builds, SBOMs, signing, CodeQL/Semgrep,
# ZAP and path-based job selection.
#
# Image layers are cached in the GitHub Actions cache, one scope per image (ADR-0021). The weekly
# scheduled run, and any manual run, builds everything without the cache, so a build that only works
# from cached layers cannot hide for long.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  quality:
    name: Lint, types, tests, scans
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build toolbox
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: compose.yaml
          targets: toolbox
          load: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          set: |
            toolbox.cache-from=type=gha,scope=raadi-toolbox-dev
            toolbox.cache-to=type=gha,scope=raadi-toolbox-dev,mode=max,ignore-error=true
      - run: ./raadi lint
      - run: ./raadi typecheck
      - run: ./raadi test
      - run: ./raadi test-integration
      - run: ./raadi licenses
      - run: ./raadi security
      - run: ./raadi iac-scan

  stack:
    name: Full stack (compose up, smoke, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Several services share one image (init, toolbox): build each image once, cached under its tag.
      - name: List images to build
        id: images
        run: |
          plan=$(docker buildx bake --print 2>/dev/null |
            jq -r '.target | to_entries | unique_by(.value.tags[0]) | .[] | "\(.key) \(.value.tags[0] | gsub("[/:]"; "-"))"')
          {
            echo 'targets<<EOF'
            cut -d' ' -f1 <<<"$plan"
            echo EOF
            echo 'set<<EOF'
            while read -r target scope; do
              echo "$target.cache-from=type=gha,scope=$scope"
              echo "$target.cache-to=type=gha,scope=$scope,mode=max,ignore-error=true"
            done <<<"$plan"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: compose.yaml
          targets: ${{ steps.images.outputs.targets }}
          load: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          set: ${{ steps.images.outputs.set }}
      # --no-build: the images above are the ones under test (pull_policy: build would rebuild them).
      - name: docker compose up --wait
        run: docker compose up -d --no-build --wait --wait-timeout 1200
      - name: Smoke test
        run: ./raadi smoke
      - name: Playwright end-to-end tests
        run: ./raadi e2e
      - name: Collect logs
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stack-diagnostics
          path: |
            compose-ps.txt
            compose-logs.txt
            tests/e2e/playwright-report/
          retention-days: 7
